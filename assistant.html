<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant – VOYAGE FACILE</title>
<meta name="description" content="Posez vos questions et réservez votre billet d'avion avec l'assistant VOYAGE FACILE, 24 h/24.">
<link rel="icon" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{background:#f6f8fb}
/* assistant */
.sr{position:absolute;left:-9999px}
.ia{display:flex;flex-direction:column;height:calc(100dvh - 64px);max-width:780px;margin:0 auto;background:#fff;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.ia-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ia-head b{display:block;color:var(--navy);font-size:15px}.ia-head span{font-size:12px;color:var(--ok)}
.ia-av{width:38px;height:38px;border-radius:50%;background:var(--navy);display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.ia-new{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;color:var(--navy)}
.ia-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#f6f8fb}
.ia-msgs>*{flex-shrink:0}
.ia-m{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px;word-wrap:break-word}
.ia-m.bot{background:#fff;border:1px solid var(--line);border-top-left-radius:6px;align-self:flex-start}
.ia-m.me{background:var(--navy);color:#fff;border-top-right-radius:6px;align-self:flex-end}
.ia-m.sys{align-self:center;background:#fde8e7;color:#7a1d15;border:1px solid #f4c7c3;font-size:14px;max-width:94%;text-align:center}
.ia-m ul{margin:4px 0 0 18px}
.ia-card{align-self:stretch;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.ia-card h4{color:var(--navy);font-size:14px;margin-bottom:8px}
.ia-offer{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.ia-leg{font-size:14px;margin:4px 0}
.ia-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.ia-row .btn{min-height:42px;padding:8px 14px;font-size:14px}
.ia-chips{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 0;background:#fff}
.ia-chips button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px;color:var(--navy)}
.ia-compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fff}
.ia-compose textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;max-height:110px;font-size:16px}
.ia-typing{display:inline-flex;gap:4px}.ia-typing i{width:7px;height:7px;border-radius:50%;background:#9fb0c5;animation:b 1s infinite}
.ia-typing i:nth-child(2){animation-delay:.15s}.ia-typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

.px-gnf{display:block;font-size:12px;font-weight:500;color:var(--muted);line-height:1.2}
</style>
</head>
<body>
<header class="top">
  <div class="hrow">
    <a class="brand" href="index.html" aria-label="VOYAGE FACILE – accueil"><svg width="40" height="40" viewBox="14 0 112 112" aria-hidden="true"><path d="M56 100 C56 100 22 70 22 45 C22 26 37 11 56 11 C75 11 90 26 90 45 C90 70 56 100 56 100 Z" fill="#ffffff"/><path d="M56 100 C56 100 22 70 22 45 C22 26 37 11 56 11 Z" fill="#dfe8f3"/><path d="M40 46 L52 58 L73 35" fill="none" stroke="#0b2545" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/><path transform="translate(96 18) rotate(-40) scale(1.25)" d="M17 0 C17 -1.5 15.6 -2.5 13 -2.5 L4.6 -2.5 L-4.8 -15.5 L-8.8 -15.5 L-3.4 -2.5 L-10.4 -2.5 L-13.8 -7.6 L-16.4 -7.6 L-14.4 -2 L-15.4 0 L-14.4 2 L-16.4 7.6 L-13.8 7.6 L-10.4 2.5 L-3.4 2.5 L-8.8 15.5 L-4.8 15.5 L4.6 2.5 L13 2.5 C15.6 2.5 17 1.5 17 0 Z" fill="#f28c28"/></svg><span><b>VOYAGE <span>FACILE</span></b><small>PARTEZ SANS SOUCI</small></span></a>
    <a class="wa-top" href="reserver.html" style="background:#f28c28;color:#0b2545">Réserver un vol</a>
  </div>
</header>
<div id="assistant"></div>
<script src="config.js"></script>
<script src="devise.js"></script>
<script src="assistant.js"></script>
</body>
</html>
